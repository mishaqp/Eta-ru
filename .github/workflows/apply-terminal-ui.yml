name: Add interactive terminal UI

on:
  push:
    branches: [feat/codex-cli-oauth]
    paths: [.github/workflows/apply-terminal-ui.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Make terminal output non-blocking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          controller = Path('app/src/main/kotlin/io/github/mangi/eta/agent/terminal/RootShellTerminalController.kt')
          text = controller.read_text()
          old = '''            "read_async_result" -> readAsyncResult(\n                jobId = jobId.orEmpty(),\n                offsetChars = offsetChars,\n                maxChars = maxChars,\n                closeIfDone = closeIfDone\n            )'''
          new = '''            "write" -> writeSessionCommand(sessionId = sessionId, command = command)\n            "read" -> readSessionOutput(sessionId = sessionId, maxChars = maxChars)\n            "read_async_result" -> readAsyncResult(\n                jobId = jobId.orEmpty(),\n                offsetChars = offsetChars,\n                maxChars = maxChars,\n                closeIfDone = closeIfDone\n            )'''
          if '"write" -> writeSessionCommand' not in text:
              if old not in text: raise SystemExit('terminal action insertion point not found')
              text = text.replace(old, new, 1)
          marker = '    private fun readAsyncResult(\n'
          if 'private fun writeSessionCommand(' not in text:
              methods = r'''    private fun writeSessionCommand(sessionId: String?, command: String): String {
        val id = sessionId?.takeIf { it.isNotBlank() }
            ?: return errorJson("SESSION_NOT_FOUND", "Не найдена сессия терминала")
        val session = synchronized(sessions) { sessions[id] }
            ?: return errorJson("SESSION_NOT_FOUND", "Не найдена сессия терминала: $id")
        val trimmed = command.trim()
        if (trimmed.isBlank()) return errorJson("INVALID_ARGUMENT", "command не может быть пустой")
        require(trimmed.length <= MAX_COMMAND_CHARS) { "command слишком длинная" }
        synchronized(session.lock) {
            if (session.closed || !session.process.isAlive) return errorJson("SESSION_CLOSED", "Сессия терминала закрыта")
            runCatching {
                session.process.outputStream.write((trimmed + "\n").toByteArray(Charsets.UTF_8))
                session.process.outputStream.flush()
            }.getOrElse { error ->
                session.closed = true
                return errorJson("SESSION_WRITE_FAILED", error.message ?: "Не удалось записать в сессию")
            }
        }
        return JSONObject().put("ok", true).put("tool", "terminal").put("action", "write")
            .put("session_id", id).put("running", session.process.isAlive).toString()
    }

    private fun readSessionOutput(sessionId: String?, maxChars: Int): String {
        val id = sessionId?.takeIf { it.isNotBlank() }
            ?: return errorJson("SESSION_NOT_FOUND", "Не найдена сессия терминала")
        val session = synchronized(sessions) { sessions[id] }
            ?: return errorJson("SESSION_NOT_FOUND", "Не найдена сессия терминала: $id")
        val limit = maxChars.coerceIn(1, MAX_OUTPUT_CHARS)
        val stdout = session.stdout.text().truncateForJson()
        val stderr = session.stderr.text().truncateForJson()
        return JSONObject().put("ok", true).put("tool", "terminal").put("action", "read")
            .put("session_id", id).put("running", session.process.isAlive && !session.closed)
            .put("stdout", stdout.takeLast(limit)).put("stderr", stderr.takeLast(limit))
            .put("truncated", stdout.length > limit || stderr.length > limit).toString()
    }

'''
              if marker not in text: raise SystemExit('readAsyncResult marker not found')
              text = text.replace(marker, methods + marker, 1)
          controller.write_text(text)

          Path('app/src/main/kotlin/io/github/mangi/eta/ui/screens/terminal/TerminalScreen.kt').write_text(r'''package io.github.mangi.eta.ui.screens.terminal

import android.content.Context
import androidx.compose.foundation.layout.padding
import androidx.compose.runtime.Composable
import androidx.compose.runtime.DisposableEffect
import androidx.compose.runtime.getValue
import androidx.compose.runtime.mutableStateOf
import androidx.compose.runtime.remember
import androidx.compose.runtime.rememberCoroutineScope
import androidx.compose.runtime.setValue
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp
import io.github.mangi.eta.R
import io.github.mangi.eta.agent.terminal.AlpineEnvironmentPaths
import io.github.mangi.eta.agent.terminal.RootShellTerminalController
import io.github.mangi.eta.core.AndroidAgentLogger
import io.github.mangi.eta.ui.components.MiuixScaffoldPage
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.launch
import kotlinx.coroutines.withContext
import org.json.JSONObject
import top.yukonga.miuix.kmp.basic.BasicComponent
import top.yukonga.miuix.kmp.basic.Card
import top.yukonga.miuix.kmp.basic.TextButton
import top.yukonga.miuix.kmp.basic.TextField

@Composable
internal fun TerminalScreen(context: Context, onBack: () -> Unit) {
    val appContext = context.applicationContext
    val controller = remember(appContext) {
        RootShellTerminalController(AndroidAgentLogger, AlpineEnvironmentPaths.rootfsDir(appContext).absolutePath)
    }
    val scope = rememberCoroutineScope()
    var command by remember { mutableStateOf("codex --version") }
    var sessionId by remember { mutableStateOf<String?>(null) }
    var output by remember { mutableStateOf("") }
    var busy by remember { mutableStateOf(false) }
    DisposableEffect(controller) { onDispose { controller.closeAll() } }

    fun displayResult(raw: String): String {
        val json = runCatching { JSONObject(raw) }.getOrNull() ?: return raw
        if (!json.optBoolean("ok")) return json.optString("message").ifBlank { raw }
        val stdout = json.optString("stdout")
        val stderr = json.optString("stderr")
        val exit = if (json.has("exit_code")) "\n[exit=${json.optInt("exit_code")}]" else ""
        return (stdout + if (stderr.isNotBlank()) "\n[stderr]\n$stderr" else "" + exit)
            .replace(Regex("\u001B\\[[;\\d?]*[ -/]*[@-~]"), "")
            .trim().ifBlank { context.getString(R.string.terminal_session_ready) }
    }

    fun call(action: () -> String) {
        if (busy) return
        busy = true
        scope.launch {
            val raw = withContext(Dispatchers.IO) { runCatching { action() }.getOrElse { error ->
                JSONObject().put("ok", false).put("message", error.message ?: error.javaClass.simpleName).toString()
            } }
            runCatching { JSONObject(raw) }.getOrNull()?.let { json ->
                if (json.optBoolean("ok")) json.optString("session_id").takeIf { it.isNotBlank() }?.let { sessionId = it }
            }
            output = displayResult(raw)
            busy = false
        }
    }

    MiuixScaffoldPage(title = context.getString(R.string.terminal_title), onBack = onBack) {
        item(key = "terminal-info") {
            Card(Modifier.padding(horizontal = 12.dp).padding(bottom = 12.dp)) {
                BasicComponent(title = context.getString(R.string.terminal_session), summary = context.getString(R.string.terminal_linux_root_hint))
            }
        }
        item(key = "terminal-command") {
            TextField(value = command, onValueChange = { command = it }, label = context.getString(R.string.terminal_command), enabled = !busy, singleLine = false, modifier = Modifier.padding(horizontal = 12.dp).padding(bottom = 8.dp))
        }
        item(key = "terminal-actions") {
            Card(Modifier.padding(horizontal = 12.dp).padding(bottom = 12.dp)) {
                TextButton(
                    text = if (busy) context.getString(R.string.terminal_working) else if (sessionId == null) context.getString(R.string.terminal_open_session) else context.getString(R.string.terminal_execute),
                    enabled = !busy && command.isNotBlank(),
                    onClick = {
                        if (sessionId == null) call { controller.terminalAction("open", "", null, 5_000, "root", true, null, null, false, 0, 16_000, false, "linux") }
                        else call {
                            val sent = controller.terminalAction("write", command, null, 5_000, "root", true, sessionId, null, false, 0, 16_000, false, "linux")
                            Thread.sleep(800)
                            val read = controller.terminalAction("read", "", null, 5_000, "root", true, sessionId, null, false, 0, 16_000, false, "linux")
                            if (JSONObject(sent).optBoolean("ok")) read else sent
                        }
                    },
                )
                TextButton(text = context.getString(R.string.terminal_login_hint), enabled = !busy && sessionId != null, onClick = { command = "codex login --device-auth" })
                TextButton(text = context.getString(R.string.terminal_refresh), enabled = !busy && sessionId != null, onClick = {
                    val id = sessionId ?: return@TextButton
                    call { controller.terminalAction("read", "", null, 5_000, "root", true, id, null, false, 0, 16_000, false, "linux") }
                })
                TextButton(text = context.getString(R.string.terminal_close_session), enabled = !busy && sessionId != null, onClick = {
                    val id = sessionId ?: return@TextButton
                    call { controller.terminalAction("close", "", null, 5_000, "root", true, id, null, false, 0, 16_000, false, "linux") }
                    sessionId = null
                })
            }
        }
        if (output.isNotBlank()) item(key = "terminal-output") {
            BasicComponent(title = context.getString(R.string.terminal_output), summary = output.takeLast(16_000))
        }
    }
}
''')

          values = Path('app/src/main/res/values/strings-terminal.xml')
          text = values.read_text()
          if 'name="terminal_refresh"' not in text:
              text = text.replace('</resources>', '  <string name="terminal_refresh">Refresh output</string>\n  <string name="terminal_session_ready">Session ready</string>\n</resources>')
              values.write_text(text)
          russian = Path('app/src/main/res/values-ru/strings-terminal.xml')
          text = russian.read_text()
          if 'name="terminal_refresh"' not in text:
              text = text.replace('</resources>', '  <string name="terminal_refresh">Обновить вывод</string>\n  <string name="terminal_session_ready">Сессия готова</string>\n</resources>')
              russian.write_text(text)
          PY
      - name: Commit terminal streaming fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/main/res
          git diff --cached --quiet || git commit -m "fix: keep Codex login session alive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
