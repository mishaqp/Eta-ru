name: Eta Build (single APK)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Сборка одного APK для arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: Build one universal Debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug

      - name: Verify and prepare APK
        id: apk
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::APK не найден: $apk"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/eta-ru-arm64-v8a-debug.apk"
          echo "path=$RUNNER_TEMP/apk/eta-ru-arm64-v8a-debug.apk" >> "$GITHUB_OUTPUT"
          file "$apk"

      - name: Upload single APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-ru-arm64-v8a-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
