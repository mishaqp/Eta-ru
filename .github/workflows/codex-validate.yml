name: Codex integration validation

on:
  push:
    branches:
      - feat/codex-provider-ui
      - feat/assistant-profiles-3.0
  pull_request:
    branches:
      - build/codex-release-once
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: Compile debug Kotlin
        run: ./gradlew --no-daemon --no-configuration-cache :app:compileDebugKotlin

      - name: Run targeted agent regression tests
        run: >-
          ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest
          --tests io.github.mangi.eta.ui.model.AgentModelPickerProjectorTest
          --tests io.github.mangi.eta.agent.runtime.AgentInterruptedProgressStoreTest
          --tests io.github.mangi.eta.ui.app.AgentRuntimeTraceLocalizationTest
          --tests io.github.mangi.eta.agent.model.OpenAiRequestMessagesTest
          --tests io.github.mangi.eta.agent.runtime.AgentRuntimeWireTest
          --tests io.github.mangi.eta.ui.app.AgentConversationStoreTest
