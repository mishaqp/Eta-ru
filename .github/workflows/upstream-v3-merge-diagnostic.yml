name: Create upstream v3 merge branch

on:
  push:
    branches: [sync-v3-diagnostic]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream v3.0.0
        shell: bash
        run: |
          cp .github/upstream-v3-resolution.patch "$RUNNER_TEMP/upstream-v3-resolution.patch"
          git config user.name 'Eta upstream sync'
          git config user.email 'eta-sync@users.noreply.github.com'
          git fetch origin eta-build
          git checkout -B merge-upstream-v3 origin/eta-build
          git remote add upstream https://github.com/Mangi-11/Eta.git
          git fetch --no-tags upstream v3.0.0
          git merge --no-commit --no-ff FETCH_HEAD || true
          git checkout --ours README.md README_EN.md docs/TECHNICAL.md
          git checkout --theirs app/src/main/kotlin/io/github/mangi/eta/agent/terminal/AlpineEnvironmentPaths.kt
          git checkout --theirs app/src/main/kotlin/io/github/mangi/eta/ui/screens/terminal/LinuxEnvironmentScreen.kt
          git rm --force app/src/main/kotlin/io/github/mangi/eta/agent/terminal/AlpinePackageProfiles.kt
          git apply "$RUNNER_TEMP/upstream-v3-resolution.patch"
          git add -A
          git diff --cached --check
          git diff --cached --name-only --diff-filter=U | tee "$RUNNER_TEMP/unresolved.txt"
          test ! -s "$RUNNER_TEMP/unresolved.txt"
          git commit -m 'sync: merge upstream Eta v3.0.0'
          git push origin HEAD:sync-v3-merged
