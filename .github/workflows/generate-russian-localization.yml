name: Generate Russian Android localization

on:
  push:
    branches:
      - feat/russian-localization
    paths:
      - app/src/main/res/values-b+zh+Hans/strings.xml
      - .github/workflows/generate-russian-localization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Generate values-ru strings
        env:
          SOURCE: app/src/main/res/values-b+zh+Hans/strings.xml
          TARGET: app/src/main/res/values-ru/strings.xml
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET

          source, target = os.environ['SOURCE'], os.environ['TARGET']
          token_re = re.compile(r'%(?:\d+\$)?[-#+ 0,(]*\d*(?:\.\d+)?[a-zA-Z]|\\[nrt\\\'\"]|https?://[^\s]+')
          chinese_re = re.compile(r'[\u3400-\u9fff]')
          cache = {}

          def mask(text):
              values = []
              def replace(match):
                  values.append(match.group(0))
                  return f'ZXQPLACEHOLDER{len(values)-1}QXZ'
              return token_re.sub(replace, text), values

          def restore(text, values):
              for index, value in enumerate(values):
                  text = text.replace(f'ZXQPLACEHOLDER{index}QXZ', value)
              return text

          def request(text):
              url = 'https://translate.googleapis.com/translate_a/single?' + urllib.parse.urlencode({
                  'client': 'gtx', 'sl': 'zh-CN', 'tl': 'ru', 'dt': 't', 'q': text
              })
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen(url, timeout=45) as response:
                          return ''.join(part[0] for part in json.loads(response.read().decode('utf-8'))[0])
                  except Exception:
                      if attempt == 7:
                          raise
                      time.sleep(10 * (attempt + 1))

          tree = ET.parse(source)
          root = tree.getroot()
          elements = [element for element in root.iter() if element.text and chinese_re.search(element.text)]
          unique = list(dict.fromkeys(element.text for element in elements))
          translations = {}

          # The public endpoint throttles individual requests. Translate groups under
          # 4,000 characters, separated by a stable ASCII marker, then map them back.
          batches, batch, size = [], [], 0
          for text in unique:
              if batch and size + len(text) + 32 > 3800:
                  batches.append(batch); batch, size = [], 0
              batch.append(text); size += len(text) + 32
          if batch:
              batches.append(batch)

          for number, batch in enumerate(batches, 1):
              masked, placeholders = zip(*(mask(text) for text in batch))
              marker = '\n__ETA_TRANSLATION_SPLIT__\n'
              translated = request(marker.join(masked))
              parts = translated.split('__ETA_TRANSLATION_SPLIT__')
              if len(parts) != len(batch):
                  raise RuntimeError(f'Unexpected translation batch split: {len(parts)} != {len(batch)}')
              for original, value, tokens in zip(batch, parts, placeholders):
                  translations[original] = restore(value.strip(), tokens)
              print(f'Completed batch {number}/{len(batches)}')
              time.sleep(1.5)

          for element in elements:
              element.text = translations[element.text]
          os.makedirs(os.path.dirname(target), exist_ok=True)
          tree.write(target, encoding='utf-8', xml_declaration=True)
          print(f'Generated {target}: {len(elements)} translated strings')
          PY

      - name: Commit localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values-ru/strings.xml
          git diff --cached --quiet || git commit -m "feat: add Russian localization"
          git push
