name: Generate Russian Android localization

on:
  push:
    branches:
      - feat/russian-localization
    paths:
      - app/src/main/res/values-b+zh+Hans/strings.xml
      - .github/workflows/generate-russian-localization.yml
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Generate values-ru strings with GitHub Models
        env:
          SOURCE: app/src/main/res/values-b+zh+Hans/strings.xml
          TARGET: app/src/main/res/values-ru/strings.xml
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          import xml.etree.ElementTree as ET

          source, target = os.environ['SOURCE'], os.environ['TARGET']
          token_re = re.compile(r'%(?:\d+\$)?[-#+ 0,(]*\d*(?:\.\d+)?[a-zA-Z]|\\[nrt\\\'\"]|https?://[^\s]+')
          chinese_re = re.compile(r'[\u3400-\u9fff]')

          def mask(text):
              values = []
              def replace(match):
                  values.append(match.group(0))
                  return f'ZXQPLACEHOLDER{len(values)-1}QXZ'
              return token_re.sub(replace, text), values

          def restore(text, values):
              for index, value in enumerate(values):
                  text = text.replace(f'ZXQPLACEHOLDER{index}QXZ', value)
              return text

          def translate_batch(texts):
              payload = {
                  'model': 'openai/gpt-4.1-mini',
                  'temperature': 0,
                  'max_tokens': 3000,
                  'response_format': {'type': 'json_object'},
                  'messages': [
                      {'role': 'system', 'content': 'You are a professional Android UI localizer. Translate Simplified Chinese to natural Russian. Preserve all tokens like ZXQPLACEHOLDER0QXZ exactly. Preserve product names, code, paths, acronyms, XML-like text and Markdown. Return only valid JSON.'},
                      {'role': 'user', 'content': 'Translate every value in this JSON object into Russian. Keep the same keys and return an object of string values only.\n' + json.dumps(texts, ensure_ascii=False)}
                  ]
              }
              request = urllib.request.Request(
                  'https://models.github.ai/inference/chat/completions',
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Content-Type': 'application/json'}
              )
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          body = json.loads(response.read().decode('utf-8'))
                      content = body['choices'][0]['message']['content']
                      if content.startswith('```'):
                          content = content.split('\n', 1)[1].rsplit('```', 1)[0]
                      result = json.loads(content)
                      if set(result) != set(texts) or not all(isinstance(value, str) for value in result.values()):
                          raise RuntimeError('Model returned an incomplete translation map')
                      return result
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(5 * (attempt + 1))

          tree = ET.parse(source)
          root = tree.getroot()
          elements = [element for element in root.iter() if element.text and chinese_re.search(element.text)]
          unique = list(dict.fromkeys(element.text for element in elements))
          translations, batches, current, current_size = {}, [], {}, 0
          for index, original in enumerate(unique):
              masked, tokens = mask(original)
              if current and current_size + len(masked) > 1800:
                  batches.append(current); current, current_size = {}, 0
              current[str(index)] = [original, masked, tokens]
              current_size += len(masked)
          if current:
              batches.append(current)

          for number, batch in enumerate(batches, 1):
              request_map = {key: value[1] for key, value in batch.items()}
              response_map = translate_batch(request_map)
              for key, (original, _masked, tokens) in batch.items():
                  translations[original] = restore(response_map[key], tokens)
              print(f'Completed batch {number}/{len(batches)}')
              time.sleep(1)

          for element in elements:
              element.text = translations[element.text]
          os.makedirs(os.path.dirname(target), exist_ok=True)
          tree.write(target, encoding='utf-8', xml_declaration=True)
          print(f'Generated {target}: {len(elements)} translated strings')
          PY

      - name: Commit localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values-ru/strings.xml
          git diff --cached --quiet || git commit -m "feat: add Russian localization"
          git push
