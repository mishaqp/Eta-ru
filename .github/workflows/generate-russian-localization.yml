name: Generate Russian Android localization

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: russian-localization
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install offline translation engine
        run: python3 -m pip install --disable-pip-version-check argostranslate

      - name: Generate values-ru strings from English source
        env:
          SOURCE: app/src/main/res/values/strings.xml
          TARGET: app/src/main/res/values-ru/strings.xml
        run: |
          python3 - <<'PY'
          import os, re
          import xml.etree.ElementTree as ET
          import argostranslate.package
          import argostranslate.translate

          source, target = os.environ['SOURCE'], os.environ['TARGET']
          latin_re = re.compile(r'[A-Za-z]')
          placeholder_re = re.compile(r'%(?:\d+\$)?[-#+ 0,(]*\d*(?:\.\d+)?[a-zA-Z]|%%')

          argostranslate.package.update_package_index()
          package = next(
              (item for item in argostranslate.package.get_available_packages()
               if item.from_code == 'en' and item.to_code == 'ru'),
              None,
          )
          if package is None:
              raise RuntimeError('Argos English-to-Russian model is unavailable')
          argostranslate.package.install_from_path(package.download())

          def protect_placeholders(text):
              tokens = []
              def replace(match):
                  index = len(tokens)
                  tokens.append(match.group(0))
                  return str(9876543200 + index)
              return placeholder_re.sub(replace, text), tokens

          def restore_placeholders(text, tokens):
              for index, token in enumerate(tokens):
                  marker = str(9876543200 + index)
                  if marker not in text:
                      raise RuntimeError(f'Translation lost protected marker {marker}: {text!r}')
                  text = text.replace(marker, token, 1)
              return text

          tree = ET.parse(source)
          root = tree.getroot()
          elements = [item for item in root.iter() if item.text and latin_re.search(item.text)]
          translations = {}
          for number, original in enumerate(dict.fromkeys(item.text for item in elements), 1):
              protected, tokens = protect_placeholders(original)
              translated = argostranslate.translate.translate(protected, 'en', 'ru')
              translated = restore_placeholders(translated, tokens)
              if placeholder_re.findall(original) != placeholder_re.findall(translated):
                  raise RuntimeError(f'Android placeholder validation failed: {original!r} -> {translated!r}')
              translations[original] = translated
              if number % 50 == 0:
                  print(f'Translated {number} unique strings')

          for item in elements:
              item.text = translations[item.text]
          os.makedirs(os.path.dirname(target), exist_ok=True)
          tree.write(target, encoding='utf-8', xml_declaration=True)
          print(f'Generated {target}: {len(elements)} translated strings')
          PY

      - name: Commit localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values-ru/strings.xml
          git diff --cached --quiet || git commit -m "feat: add Russian localization"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
