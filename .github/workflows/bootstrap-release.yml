name: Bootstrap signing key and release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Создание ключа и одного Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: Generate persistent release key
        env:
          KEYSTORE: ${{ runner.temp }}/eta-release.jks
          KEY_ALIAS: eta-ru-release
        run: |
          password="$(openssl rand -hex 32)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Eta RU, OU=Eta, O=Eta, L=Unknown, ST=Unknown, C=RU"
          printf 'ETA_RELEASE_STORE_PASSWORD=%s\nETA_RELEASE_KEY_ALIAS=%s\nETA_RELEASE_KEY_PASSWORD=%s\n' \
            "$password" "$KEY_ALIAS" "$password" > "$RUNNER_TEMP/credentials.txt"
          base64 -w 0 "$KEYSTORE" > "$RUNNER_TEMP/keystore.base64"

      - name: Build one signed Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_KEY_ALIAS: eta-ru-release
        run: |
          password="$(sed -n 's/^ETA_RELEASE_STORE_PASSWORD=//p' "$RUNNER_TEMP/credentials.txt")"
          export ETA_RELEASE_STORE_PASSWORD="$password"
          export ETA_RELEASE_KEY_PASSWORD="$password"
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: Verify and prepare APK
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$apk"
          "$signer" verify "$apk"
          mkdir -p "$RUNNER_TEMP/output"
          cp "$apk" "$RUNNER_TEMP/output/eta-ru-arm64-v8a-release.apk"

      - name: Upload one Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-ru-arm64-v8a-release
          path: ${{ runner.temp }}/output/eta-ru-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload key material for GitHub Secrets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-ru-signing-key-material
          path: |
            ${{ runner.temp }}/eta-release.jks
            ${{ runner.temp }}/credentials.txt
            ${{ runner.temp }}/keystore.base64
          if-no-files-found: error
          retention-days: 14
